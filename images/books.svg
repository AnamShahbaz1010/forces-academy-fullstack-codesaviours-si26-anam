<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tw { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tw2 { animation-delay: 1.2s; }
    @keyframes twinkle { 0%,100% { transform: scale(0.6); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
  </style>
  <ellipse cx="108" cy="188" rx="86" ry="7" fill="#000" opacity="0.10"/>
  <!-- bottom book -->
  <rect x="20" y="152" width="172" height="30" rx="6" fill="#1F6F78"/>
  <rect x="150" y="158" width="36" height="18" rx="3" fill="#FFF8E7"/>
  <rect x="34" y="152" width="7" height="30" fill="#174F56"/>
  <!-- second book -->
  <rect x="34" y="122" width="150" height="29" rx="6" fill="#E8BE6A"/>
  <rect x="140" y="128" width="38" height="17" rx="3" fill="#FFF8E7"/>
  <rect x="48" y="122" width="7" height="29" fill="#C9962F"/>
  <!-- third book (tilted) -->
  <g transform="rotate(-3 106 104)">
    <rect x="28" y="92" width="160" height="27" rx="6" fill="#E98F78"/>
    <rect x="146" y="98" width="36" height="15" rx="3" fill="#FFF8E7"/>
    <rect x="42" y="92" width="7" height="27" fill="#C9694F"/>
  </g>
  <!-- top book (tilted) -->
  <g transform="rotate(2 106 78)">
    <rect x="46" y="66" width="130" height="25" rx="6" fill="#8FBF73"/>
    <rect x="136" y="71" width="34" height="15" rx="3" fill="#FFF8E7"/>
    <rect x="58" y="66" width="7" height="25" fill="#6E9C53"/>
  </g>
  <!-- graduation cap -->
  <path d="M82 50 v14 q28 14 56 0 v-14" fill="#174F56"/>
  <polygon points="110,22 166,42 110,62 54,42" fill="#1F6F78"/>
  <line x1="160" y1="44" x2="160" y2="66" stroke="#E8BE6A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="160" cy="69" r="4.5" fill="#E8BE6A"/>
  <!-- sparkles -->
  <path class="tw" d="M196 34 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#E8BE6A"/>
  <path class="tw tw2" d="M26 56 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#6BB5AE"/>
</svg>
